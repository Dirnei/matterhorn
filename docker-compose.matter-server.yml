# matterjs-server — the Matter controller Matterhorn talks to.
#
# matterjs-server (https://github.com/matter-js/matterjs-server) is the maintained successor to the
# now-archived home-assistant-libs/python-matter-server; it exposes the same WebSocket API on the
# same port (5580, /ws), so Matterhorn drives either one unchanged.
#
# Run this ON A LINUX HOST (e.g. your Raspberry Pi) on the same LAN as your devices. It uses host
# networking: Matter commissioning needs mDNS + IPv6 link-local access to the device, which a Docker
# bridge network can't provide — which is also why it can't run under Docker Desktop on Windows/mac.
#
#   On the host:
#     docker compose -f docker-compose.matter-server.yml up -d
#     docker compose -f docker-compose.matter-server.yml logs -f    # watch commissioning
#
#   Then point Matterhorn at it (from anywhere on the LAN):
#     CONTROLLER_WS_URL=ws://<host-ip>:5580/ws   (see .env.example)

name: matterjs-server

services:
  matterjs-server:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matterjs-server
    restart: unless-stopped
    network_mode: host                 # required for mDNS/IPv6 commissioning; Linux host only
    environment:
      PRODUCTION_MODE: "true"
      LOG_LEVEL: info
      # BLE is the bootstrap radio for onboarding a factory-fresh Thread/Wi-Fi device: it has no IP
      # yet, so the controller reaches it over BLE just long enough to hand over the network
      # credentials, then everything continues over IP. A device already on the network (e.g. joined
      # via Apple Home multi-admin) is commissioned on-network and needs none of this.
      #
      # The dbus backend talks to the host's BlueZ daemon instead of opening a raw HCI socket, which
      # is what keeps this container unprivileged — the socket below is the only host resource it
      # needs. The host must have BlueZ running and the adapter powered on.
      NOBLE_BINDINGS: dbus
      BLUETOOTH_ADAPTER: "0"           # hci0
    volumes:
      - matter-data:/data              # fabric credentials + node database (persist across restarts)
      - /run/dbus:/run/dbus:ro         # host BlueZ, read-only

volumes:
  matter-data:
