<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<title>Matterhorn · bridge station</title>
<style>
  :root {
    --bg:#e7edf1; --surface:#fbfcfd; --surface2:#eef3f6; --ink:#1b2732; --muted:#63727f;
    --line:#cbd6dd; --enzian:#12508f; --enzian-bright:#2f7fc9; --loden:#4f7043; --loden-bright:#5d8a49;
    --alpenglow:#b1502d; --bav:#0a5ca8;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f151b; --surface:#161f28; --surface2:#1b2632; --ink:#e3ebf1; --muted:#8797a5;
      --line:#26313b; --enzian:#4f97d8; --enzian-bright:#6fb0e8; --loden:#7ba363; --loden-bright:#8fb974;
      --alpenglow:#d9724b; --bav:#2f7fc9;
    }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  /* Bavarian blue-and-white striped trim */
  body::before {
    content:""; position:fixed; inset:0 0 auto 0; height:2px; z-index:20;
    background:repeating-linear-gradient(90deg, #0a5ca8 0 16px, #ffffff 16px 32px);
  }
  .legend { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--muted); }

  header {
    position:relative; overflow:hidden; border-bottom:1px solid var(--line);
    padding:65px 24px 20px; background:var(--surface);
  }
  header .ridge { position:absolute; left:0; right:0; bottom:0; height:140px; width:100%; pointer-events:none; }
  header .row { position:relative; display:flex; flex-wrap:wrap; gap:16px 28px; align-items:flex-end; justify-content:space-between; max-width:1180px; margin:0 auto; }
  .wordmark { font-weight:800; font-size:26px; letter-spacing:.10em; line-height:1; }
  .wordmark b { color:var(--enzian); }
  .tagline { margin-top:6px; font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.02em; }
  .tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .link { display:flex; align-items:center; gap:7px; }
  .bench { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid var(--muted); }
  .bench.up { border-bottom-color:var(--loden); }
  .link.live .bench { border-bottom-color:var(--loden); animation:beat 2.6s ease-out infinite; }
  .link .legend { transition:color .2s; }
  .link.live .legend { color:var(--loden); }
  @keyframes beat { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  input, button {
    font:inherit; color:var(--ink); background:var(--surface2); border:1px solid var(--line);
    border-radius:7px; padding:7px 11px;
  }
  input { font-family:var(--mono); font-size:12px; }
  input::placeholder { color:var(--muted); }
  :focus-visible { outline:2px solid var(--enzian); outline-offset:1px; }
  button { cursor:pointer; }
  button.go { background:var(--enzian); border-color:transparent; color:#fff; font-weight:600; letter-spacing:.02em; }
  form.commission { display:flex; gap:8px; }
  form.commission input { width:min(32vw,208px); }

  main { max-width:1180px; margin:0 auto; padding:24px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(288px,1fr)); }
  .station { position:relative; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 16px 16px; overflow:hidden; }
  .station::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--enzian),var(--enzian-bright)); }
  .st-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:16px 0 12px; border-bottom:1px solid var(--line); }
  .name { font-weight:650; font-size:15.5px; word-break:break-all; }
  .coords { font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:3px; }
  .pill { display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
          padding:1px 6px; border:1px solid var(--line); border-radius:999px; color:var(--muted); margin-left:6px; vertical-align:middle; }
  .picker { display:flex; justify-content:center; padding:4px 0 2px; }
  .inactive { opacity:.4; }
  .rows { padding-top:14px; display:flex; flex-direction:column; gap:13px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .readout { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px; }
  .readout .u { color:var(--muted); font-size:11px; margin-left:3px; }
  /* editable value field — looks like a readout, accepts typed input */
  input.entry { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px;
                width:66px; text-align:right; padding:2px 7px; border-radius:6px; }
  input.entry[type=number] { -moz-appearance:textfield; appearance:textfield; }
  input.entry::-webkit-outer-spin-button, input.entry::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .ctl { display:flex; flex-direction:column; gap:7px; }
  .ctl .row { margin:0; }

  .switch { position:relative; width:46px; height:26px; flex:none; }
  .switch input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; width:100%; height:100%; }
  .switch .slot { position:absolute; inset:0; background:var(--line); border-radius:999px; transition:background .18s; pointer-events:none; }
  .switch .knob { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .18s; box-shadow:0 1px 2px rgba(0,0,0,.35); pointer-events:none; }
  .switch input:checked + .slot { background:var(--loden); }
  .switch input:checked + .slot + .knob { left:23px; }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px; padding:0; border:none; border-radius:3px; background:var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--enzian); border:2px solid var(--surface); cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:var(--enzian); border:2px solid var(--surface); cursor:pointer; }

  .contour { position:fixed; right:-80px; bottom:-80px; width:420px; height:420px; z-index:-1; color:var(--enzian); opacity:.05; pointer-events:none; }
  .empty { text-align:center; color:var(--muted); padding:70px 20px; font-family:var(--mono); }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--alpenglow); color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
  .toast.show { opacity:1; }

  .st-tools { display:flex; align-items:center; gap:10px; }
  .kebab { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
           background:transparent; border:none; padding:0; font-size:18px; line-height:1; color:var(--muted);
           border-radius:7px; transition:background .15s, color .15s; }
  .kebab:hover { background:var(--surface2); color:var(--ink); }

  .menu { position:absolute; z-index:40; min-width:154px; background:var(--surface); border:1px solid var(--line);
          border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.2), 0 2px 6px rgba(0,0,0,.08);
          padding:5px; display:none; transform-origin:top right; }
  .menu.open { display:block; animation:menuIn .14s cubic-bezier(.2,.7,.3,1); }
  @keyframes menuIn { from{ opacity:0; transform:translateY(-4px) scale(.97); } to{ opacity:1; transform:none; } }
  .menu button { display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:transparent;
                 border:none; padding:8px 10px; border-radius:6px; color:var(--ink); font-size:13px; }
  .menu button:hover { background:var(--surface2); }
  .menu button.danger { color:var(--alpenglow); margin-top:4px; padding-top:9px; border-top:1px solid var(--line); }

  .name-edit { font-family:var(--mono); font-size:14px; padding:3px 6px; width:100%;
               border:1px solid var(--enzian); border-radius:6px; background:var(--surface2); color:var(--ink); }

  .modal-backdrop { position:fixed; inset:0; background:rgba(10,16,22,.5); -webkit-backdrop-filter:blur(1px); backdrop-filter:blur(1px);
                    z-index:50; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--line); border-radius:14px; max-width:380px; width:100%;
           padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.32), 0 4px 12px rgba(0,0,0,.12);
           animation:modalIn .16s cubic-bezier(.2,.7,.3,1); }
  @keyframes modalIn { from{ opacity:0; transform:translateY(6px) scale(.98); } to{ opacity:1; transform:none; } }
  .modal h3 { margin:0 0 8px; font-size:16px; font-weight:650; }
  .modal p { margin:0 0 18px; color:var(--muted); line-height:1.5; }
  .modal .actions { display:flex; justify-content:flex-end; gap:10px; }
  .modal .actions button:hover { background:var(--line); }
  .modal .danger { background:var(--alpenglow); border-color:transparent; color:#fff; font-weight:600; }
  .modal .danger:hover { filter:brightness(1.08); background:var(--alpenglow); }

  @media (prefers-reduced-motion: reduce) { .switch .slot,.switch .knob{transition:none;} .link.live .bench{animation:none;} .menu.open,.modal{animation:none;} }

  /* Station Log dock */
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:25; background:#0f151b; color:#c7d4de;
          font-family:var(--mono); border-top:1px solid #26313b; box-shadow:0 -6px 20px rgba(0,0,0,.28); }
  .dock .dhd { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 12px;
               background:#161f28; border-bottom:1px solid #26313b; cursor:pointer; }
  .dock .dtitle { color:#8797a5; letter-spacing:.13em; text-transform:uppercase; font-size:10px; font-weight:700; }
  .dock .dctrls { display:flex; align-items:center; gap:8px; }
  .dock .dctrls .last { color:#5b6b78; font-size:11px; max-width:38vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dtoggle { display:flex; border:1px solid #26313b; border-radius:5px; overflow:hidden; font-size:10px; }
  .dtoggle span { padding:2px 9px; color:#8797a5; cursor:pointer; }
  .dtoggle span.on { background:var(--enzian); color:#fff; }
  .dbtn { font-size:10px; color:#8797a5; background:transparent; border:1px solid #26313b; border-radius:5px; padding:2px 8px; cursor:pointer; }
  .dbtn.active { color:#fff; border-color:var(--enzian); }
  .dock .dbody { height:180px; overflow-y:auto; padding:7px 12px; font-size:12px; line-height:1.7; }
  .dock.collapsed .dbody { display:none; }
  /* drag handle on the top edge — grab and drag up/down to resize */
  .dock .dgrip { height:7px; cursor:ns-resize; position:relative; touch-action:none; }
  .dock .dgrip::before { content:""; position:absolute; left:50%; top:2px; transform:translateX(-50%);
      width:38px; height:3px; border-radius:2px; background:#26313b; transition:background .15s; }
  .dock .dgrip:hover::before { background:var(--enzian); }
  .dock.collapsed .dgrip { display:none; }
  .dock .ln { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dock .ln .t { color:#5b6b78; }
  .dock .ln.info .k { color:#6fb0e8; }
  .dock .ln.ok   .k { color:#8fb974; }
  .dock .ln.warn .k { color:#d9724b; }
  main { padding-bottom:210px; }  /* keep the grid clear of the docked console */

  /* commissioning progress modal */
  .modal.comm { text-align:center; max-width:340px; }
  .modal.comm .spinner { width:46px; height:46px; margin:2px auto 16px; border-radius:50%;
      border:3px solid var(--line); border-top-color:var(--enzian); animation:spin .9s linear infinite; }
  .modal.comm h3 { margin-bottom:6px; }
  .modal.comm .comm-msg { font-family:var(--mono); font-size:13px; color:var(--ink); min-height:1.5em;
      margin:0 0 8px; transition:opacity .22s; }
  .modal.comm .comm-hint { color:var(--muted); font-size:12px; margin:0 0 16px; }
  .modal.comm .comm-hide { background:transparent; border:none; color:var(--muted); font-size:12px;
      cursor:pointer; text-decoration:underline; padding:2px 6px; }
  .modal.comm .comm-hide:hover { color:var(--ink); background:transparent; }
  .modal.comm.done .spinner { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Groups section */
  #groupsSection { max-width:1180px; margin:0 auto; padding:24px 24px 0; }
  .section-head { display:flex; align-items:center; justify-content:space-between; gap:16px 28px; flex-wrap:wrap; margin-bottom:14px; }
  .section-head .legend { font-size:13px; }
  form.newgroup { display:flex; gap:8px; }
  form.newgroup input { width:min(32vw,208px); }
  .groups-grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(288px,1fr)); }
  .station.group::before { background:linear-gradient(90deg,var(--loden),var(--loden-bright)); }
  .chips { flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px;
          padding:3px 6px 3px 10px; background:var(--surface2); border:1px solid var(--line); border-radius:999px; }
  .chip button { background:transparent; border:none; padding:0; margin:0; color:var(--muted); font-size:12px; line-height:1; }
  .chip button:hover { color:var(--alpenglow); }
  .add-member select { flex:1; }

  /* Scenes section */
  #scenesSection { max-width:1180px; margin:0 auto; padding:24px 24px 0; }
  .scenes-grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(288px,1fr)); }
  .station.scene::before { background:linear-gradient(90deg,var(--alpenglow),var(--bav)); }
  .capture-members { max-height:220px; overflow-y:auto; margin:10px 0 18px; padding:8px 10px;
                      border:1px solid var(--line); border-radius:8px; background:var(--surface2); }
  .capture-members label { display:flex; align-items:center; gap:8px; padding:4px 2px; font-family:var(--mono); font-size:12.5px; }
  .capture-members input[type=checkbox] { margin:0; }
  #captureForm #captureName { width:100%; margin-top:2px; }
</style>
</head>
<body>
<header>
  <svg class="ridge" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,120 L150,86 L250,98 L380,52 L470,74 L560,34 L610,50 L690,10 L742,46 L830,66 L940,40 L1050,78 L1200,58 L1200,120 Z" fill="var(--enzian)" opacity="0.06"/>
    <path class="draw" d="M0,120 L150,86 L250,98 L380,52 L470,74 L560,34 L610,50 L690,10 L742,46 L830,66 L940,40 L1050,78 L1200,58" fill="none" stroke="var(--enzian)" stroke-width="1.5" opacity="0.35"/>
  </svg>
  <div class="row">
    <div>
      <div class="wordmark">MATTER<b>HORN</b></div>
      <div class="tagline">matter → mqtt · alpine bridge station</div>
    </div>
    <div class="tools">
      <span class="link" id="link" title="live stream"><span class="bench"></span><span class="legend">link</span></span>
      <input id="apikey" type="password" placeholder="api key" autocomplete="off" />
      <form class="commission" id="commissionForm">
        <input id="code" placeholder="setup code · MT:…" autocomplete="off" />
        <button class="go" type="submit">Commission</button>
      </form>
    </div>
  </div>
</header>

<section id="groupsSection">
  <div class="section-head">
    <span class="legend">Groups</span>
    <form class="newgroup" id="newGroupForm">
      <input id="newGroupName" placeholder="group name" autocomplete="off" />
      <button class="go" type="submit">New group</button>
    </form>
  </div>
  <div class="groups-grid" id="groupsGrid"></div>
  <div class="empty" id="groupsEmpty" hidden>No groups yet. Create one above.</div>
</section>

<section id="scenesSection">
  <div class="section-head">
    <span class="legend">Scenes</span>
    <button class="go" type="button" id="captureSceneBtn">Capture scene</button>
  </div>
  <div class="scenes-grid" id="scenesGrid"></div>
  <div class="empty" id="scenesEmpty" hidden>No scenes yet. Capture one above.</div>
</section>

<main id="grid"></main>
<div class="empty" id="empty" hidden>No stations on the fabric. Commission a device to begin.</div>

<svg class="contour" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <g stroke="currentColor" stroke-width="1.4">
    <path d="M100 22 C142 30 178 66 176 108 C174 150 132 182 92 176 C54 170 26 132 32 96 C38 60 66 16 100 22Z"/>
    <path d="M100 46 C132 52 158 80 156 112 C154 144 122 166 92 160 C64 154 46 126 50 100 C54 74 74 42 100 46Z"/>
    <path d="M100 70 C122 74 140 94 138 116 C136 138 114 152 94 148 C74 144 64 124 68 106 C72 88 84 66 100 70Z"/>
    <path d="M100 94 C112 96 122 106 121 118 C120 130 108 138 96 136 C86 134 82 122 84 112 C86 102 92 92 100 94Z"/>
  </g>
</svg>
<div class="toast" id="toast"></div>

<div class="dock collapsed" id="dock">
  <div class="dgrip" id="dockGrip" aria-hidden="true"></div>
  <div class="dhd" id="dockHead">
    <span class="dtitle">▤ Station Log</span>
    <div class="dctrls" onclick="event.stopPropagation()">
      <span class="last" id="dockLast">waiting for events…</span>
      <span class="dtoggle" id="dockMode">
        <span class="on" data-mode="activity">Activity</span><span data-mode="raw">Raw</span>
      </span>
      <button class="dbtn" id="dockPause">pause</button>
      <button class="dbtn" id="dockClear">clear</button>
      <button class="dbtn" id="dockToggle">▲</button>
    </div>
  </div>
  <div class="dbody" id="dockBody"></div>
</div>

<script src="iro.min.js"></script>
<script>
const grid = document.getElementById('grid');
const link = document.getElementById('link');
const keyInput = document.getElementById('apikey');
const SETTABLE = new Set(['state','brightness','color_temp']);
const pickers = new Map();   // friendly_name -> { picker, dragging }
const HSMAX = 254;           // Matter hue/saturation max

let apiKey = localStorage.getItem('mh_key') || '';
keyInput.value = apiKey;

const defs = new Map();
const states = new Map();

function headers(extra){ return Object.assign(apiKey?{'X-Api-Key':apiKey}:{}, extra||{}); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

async function api(path, opts){
  const r = await fetch(path, Object.assign({ headers: headers(opts&&opts.body?{'Content-Type':'application/json'}:{}) }, opts));
  if (r.status===401){ toast('Unauthorized — check the API key'); throw new Error('401'); }
  return r;
}
async function patch(name, body){
  try { await api('/api/devices/'+encodeURIComponent(name), { method:'PATCH', body:JSON.stringify(body) }); }
  catch(e){ if(e.message!=='401') toast('Set failed'); }
}

// ---- per-device actions: a single body-level menu + modal (the card clips overflow) ----
const devMenu = document.createElement('div');
devMenu.className = 'menu';
devMenu.innerHTML = `<button data-act="rename">✎ Rename</button><button data-act="unpair" class="danger">⌫ Unpair…</button>`;
document.body.appendChild(devMenu);
let menuTarget = null, menuBtn = null;

function openMenu(btn, name){
  menuTarget = name;
  menuBtn?.setAttribute('aria-expanded','false');      // reset a previously-open kebab when retargeting
  menuBtn = btn; btn.setAttribute('aria-expanded','true');
  devMenu.classList.add('open');                       // display first so offsetWidth is measurable
  const r = btn.getBoundingClientRect();
  devMenu.style.top  = (window.scrollY + r.bottom + 4) + 'px';
  devMenu.style.left = (window.scrollX + r.right - devMenu.offsetWidth) + 'px';
  devMenu.querySelector('button').focus();             // move focus into the menu (keyboard a11y)
}
function closeMenu(returnFocus){
  if (!devMenu.classList.contains('open')) return;
  devMenu.classList.remove('open'); menuTarget = null;
  menuBtn?.setAttribute('aria-expanded','false');
  if (returnFocus) menuBtn?.focus();                   // return focus to the invoking kebab
}

devMenu.addEventListener('click', e=>{
  const act = e.target.closest('button')?.dataset.act; if(!act) return;
  const name = menuTarget, origin = menuBtn; closeMenu();   // startRename/openUnpair focus their own target
  if (act==='rename') startRename(name);
  else if (act==='unpair') openUnpair(name, origin);
});
devMenu.addEventListener('keydown', e=>{               // arrow-key navigation within the open menu
  const items = [...devMenu.querySelectorAll('button')];
  const i = items.indexOf(document.activeElement);
  if (e.key==='ArrowDown'){ e.preventDefault(); items[(i+1)%items.length].focus(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
  else if (e.key==='Escape'){ e.preventDefault(); closeMenu(true); }
});
document.addEventListener('click', e=>{
  if (devMenu.classList.contains('open') && !devMenu.contains(e.target)) closeMenu();
});

function startRename(name){
  const el = document.getElementById('dev-'+cssId(name)); if(!el) return;
  const nameEl = el.querySelector('.name'); if(!nameEl || nameEl.querySelector('input')) return;
  const input = document.createElement('input');
  input.className = 'name-edit'; input.value = name; input.setAttribute('aria-label','New device name');
  nameEl.replaceChildren(input); input.focus(); input.select();
  let done = false;
  const restore = ()=>{ nameEl.textContent = name; };          // SSE 'devices' will re-render with the real name
  const cancel  = ()=>{ if(done) return; done = true; restore(); };
  const commit  = async ()=>{
    if(done) return; const to = input.value.trim();
    if(!to || to===name){ done = true; restore(); return; }
    done = true;
    try {
      const r = await api('/api/devices/'+encodeURIComponent(name)+'/rename', { method:'POST', body:JSON.stringify({to}) });
      if (r.status===409) toast('That name is already taken');
      else if (r.status===400) toast('That name can’t be used');
      else if (!r.ok) toast('Rename failed');

function colorControl(name){
  const wrap=document.createElement('div'); wrap.className='ctl';
  wrap.innerHTML=`<div class="row"><span class="legend">color</span></div><div class="picker"></div>
    <div class="row"><span class="legend">hue</span>
      <input class="entry" type="number" inputmode="numeric" min="0" max="${HSMAX}" data-prop="hue" aria-label="hue value"></div>
    <div class="row"><span class="legend">saturation</span>
      <input class="entry" type="number" inputmode="numeric" min="0" max="${HSMAX}" data-prop="saturation" aria-label="saturation value"></div>`;
  const mount=wrap.querySelector('.picker');
  const picker=new iro.ColorPicker(mount,{width:150,color:{h:0,s:0,v:100},layout:[{component:iro.ui.Wheel}]});
  const rec={picker,dragging:false};
  pickers.set(name,rec);
  picker.on('input:start',()=>rec.dragging=true);
  picker.on('input:end',()=>{
    rec.dragging=false;
    const {h,s}=picker.color.hsv;
    patch(name,{hue:Math.round(h*HSMAX/360), saturation:Math.round(s*HSMAX/100)});
  });
  // Raw HS entry: edit the exact Matter values (0–HSMAX). Commit on Enter or blur.
  const clamp=v=>Math.min(HSMAX,Math.max(0,Math.round(v)));
  for (const prop of ['hue','saturation']){
    const box=wrap.querySelector(`input.entry[data-prop="${prop}"]`);
    box.addEventListener('change',()=>{ if(box.value==='') return; const v=clamp(Number(box.value)); box.value=v; patch(name,{[prop]:v}); });
    box.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); box.blur(); } });
  }
  return wrap;
}

function control(name,e){
  const wrap=document.createElement('div');
  if (e.property==='state'){
    wrap.className='row';
    wrap.innerHTML=`<span class="legend">state</span>
      <span class="switch"><input type="checkbox" data-prop="state"><span class="slot"></span><span class="knob"></span></span>`;
    wrap.querySelector('input').addEventListener('change',ev=>patch(name,{state:ev.target.checked?'ON':'OFF'}));
  } else {
    wrap.className='ctl';
    const min=e.value_min??0, max=e.value_max??254;
    const label=esc(e.property.replace('_',' '));
    wrap.innerHTML=`<div class="row"><span class="legend">${label}</span>
        <input class="entry" type="number" inputmode="numeric" min="${min}" max="${max}" data-prop="${e.property}-val" aria-label="${label} value"></div>
      <input type="range" min="${min}" max="${max}" data-prop="${e.property}">`;
    const s=wrap.querySelector('input[type=range]');
    const box=wrap.querySelector('input[type=number]');
    const clamp=v=>Math.min(max,Math.max(min,Math.round(v)));
    // Suppress live updates only while actively dragging — a range input keeps focus after you
    // release it, so guarding on focus alone would freeze the slider until you clicked elsewhere.
    const startDrag=()=>s.dataset.dragging='1', endDrag=()=>delete s.dataset.dragging;
    s.addEventListener('pointerdown',startDrag);
    s.addEventListener('pointerup',endDrag);
    s.addEventListener('pointercancel',endDrag);
    s.addEventListener('input',()=>{ if(box!==document.activeElement) box.value=s.value; });
    s.addEventListener('change',()=>{ endDrag(); patch(name,{[e.property]:Number(s.value)}); });
    // Typed entry: mirror the slider live, commit (clamp + patch) on Enter or blur.
    box.addEventListener('input',()=>{ if(box.value!=='') s.value=clamp(Number(box.value)); });
    box.addEventListener('change',()=>{ if(box.value==='') return; const v=clamp(Number(box.value)); box.value=v; s.value=v; patch(name,{[e.property]:v}); });
    box.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); box.blur(); } });
  }
  return wrap;
}

function readoutRow(e){
  const row=document.createElement('div'); row.className='row';
  row.innerHTML=`<span class="legend">${esc(e.property)}</span>
    <span class="readout" data-prop="${e.property}">—<span class="u">${e.unit?' '+esc(e.unit):''}</span></span>`;
  return row;
}

function applyState(name){
  const el=document.getElementById('dev-'+cssId(name)); if(!el) return;
  const s=states.get(name)||{};
  for (const [prop,val] of Object.entries(s)){
    const t=el.querySelector(`input[type=checkbox][data-prop="${prop}"]`);
    if (t){ t.checked=String(val).toUpperCase()==='ON'; continue; }
    const sl=el.querySelector(`input[type=range][data-prop="${prop}"]`);
    if (sl){ if(sl.dataset.dragging!=='1'){ sl.value=val; const box=el.querySelector(`input[type=number][data-prop="${prop}-val"]`); if(box && box!==document.activeElement) box.value=val; } continue; }
    const ro=el.querySelector(`.readout[data-prop="${prop}"]`);
    if (ro) ro.firstChild.textContent=fmt(val);
  }
  // Color wheel: drive it from live hue/saturation (value pinned so the wheel shows pure hue+sat).
  const rec=pickers.get(name);
  if (rec && !rec.dragging && s.hue!=null && s.saturation!=null)
    rec.picker.color.hsv={ h:s.hue*360/HSMAX, s:s.saturation*100/HSMAX, v:100 };
  // Raw HS entry fields track live state (unless the user is editing one).
  for (const prop of ['hue','saturation']){
    if (s[prop]==null) continue;
    const box=el.querySelector(`input.entry[data-prop="${prop}"]`);
    if (box && box!==document.activeElement) box.value=s[prop];
  }
  // De-emphasize whichever color representation is not the live one (ColorMode).
  if (rec){
    const pk=el.querySelector('.picker');
    if (pk) pk.classList.toggle('inactive', s.color_mode==='ct');
    const ct=el.querySelector('input[type=range][data-prop="color_temp"]');
    if (ct) ct.closest('.ctl')?.classList.toggle('inactive', s.color_mode==='hs');
  }
}

function startGroupRename(name){
  const el = document.getElementById('grp-'+cssId(name)); if(!el) return;

  const input = document.createElement('input');
  input.className = 'name-edit'; input.value = name; input.setAttribute('aria-label','New group name');
  nameEl.replaceChildren(input); input.focus(); input.select();
  let done = false;
  const restore = ()=>{ nameEl.textContent = name; };          // SSE 'groups' will re-render with the real name
  const cancel  = ()=>{ if(done) return; done = true; restore(); };
  const commit  = async ()=>{
    if(done) return; const to = input.value.trim();
    if(!to || to===name){ done = true; restore(); return; }
    done = true;
    try {
      const r = await api('/api/groups/'+encodeURIComponent(name)+'/rename', { method:'POST', body:JSON.stringify({to}) });
      if (r.status===409) toast('That name is already taken');
      else if (r.status===400) toast('That name can’t be used');
      else if (!r.ok) toast('Rename failed');
      else { toast('Renamed'); loadGroups(); }
    } catch(e){ if(e.message!=='401') toast('Rename failed'); }
    restore();
  };
  input.addEventListener('keydown', e=>{
    if (e.key==='Enter'){ e.preventDefault(); commit(); }
    else if (e.key==='Escape'){ e.preventDefault(); cancel(); }
  });

}

  const act = e.target.closest('button')?.dataset.act; if(!act) return;
  const name = sceneMenuTarget, origin = sceneMenuBtn; closeSceneMenu();
  if (act==='rename') startSceneRename(name);
  else if (act==='delete') openSceneDelete(name, origin);
});
sceneMenu.addEventListener('keydown', e=>{
  const items = [...sceneMenu.querySelectorAll('button')];
  const i = items.indexOf(document.activeElement);
  if (e.key==='ArrowDown'){ e.preventDefault(); items[(i+1)%items.length].focus(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
  else if (e.key==='Escape'){ e.preventDefault(); closeSceneMenu(true); }
});
document.addEventListener('click', e=>{
  if (sceneMenu.classList.contains('open') && !sceneMenu.contains(e.target)) closeSceneMenu();
});

function startSceneRename(name){
  const el = document.getElementById('scn-'+cssId(name)); if(!el) return;
  const nameEl = el.querySelector('.name'); if(!nameEl || nameEl.querySelector('input')) return;
  const input = document.createElement('input');
  input.className = 'name-edit'; input.value = name; input.setAttribute('aria-label','New scene name');
  nameEl.replaceChildren(input); input.focus(); input.select();
  let done = false;
  const restore = ()=>{ nameEl.textContent = name; };          // SSE 'scenes' will re-render with the real name
  const cancel  = ()=>{ if(done) return; done = true; restore(); };
  const commit  = async ()=>{
    if(done) return; const to = input.value.trim();
    if(!to || to===name){ done = true; restore(); return; }
    done = true;
    try {
      const r = await api('/api/scenes/'+encodeURIComponent(name)+'/rename', { method:'POST', body:JSON.stringify({to}) });
      if (r.status===409) toast('That name is already taken');
      else if (r.status===400) toast('That name can’t be used');
      else if (!r.ok) toast('Rename failed');
      else { toast('Renamed'); loadScenes(); }
    } catch(e){ if(e.message!=='401') toast('Rename failed'); }
    restore();
  };
  input.addEventListener('keydown', e=>{
    if (e.key==='Enter'){ e.preventDefault(); commit(); }
    else if (e.key==='Escape'){ e.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', cancel);
}

// ---- scene delete confirmation modal ----
const sceneBackdrop = document.createElement('div');
sceneBackdrop.className = 'modal-backdrop';
sceneBackdrop.innerHTML =
  `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sceneDeleteTitle">
     <h3 id="sceneDeleteTitle">Delete scene?</h3>
     <p id="sceneDeleteBody"></p>
     <div class="actions"><button data-act="cancel">Cancel</button><button data-act="confirm" class="danger">Delete</button></div>
   </div>`;
document.body.appendChild(sceneBackdrop);
let sceneDeleteTarget = null, sceneDeleteBtn = null;

function openSceneDelete(name, origin){
  sceneDeleteTarget = name; sceneDeleteBtn = origin || null;
  sceneBackdrop.querySelector('#sceneDeleteTitle').textContent = 'Delete “'+name+'”?';
  sceneBackdrop.querySelector('#sceneDeleteBody').textContent =
    'The scene and its snapshot will be removed. Member devices are not affected.';
  sceneBackdrop.classList.add('open');
  sceneBackdrop.querySelector('[data-act="confirm"]').focus();
}
function closeSceneDelete(returnFocus){
  if (!sceneBackdrop.classList.contains('open')) return;
  sceneBackdrop.classList.remove('open'); sceneDeleteTarget = null;
  if (returnFocus) sceneDeleteBtn?.focus();
  sceneDeleteBtn = null;
}
sceneBackdrop.addEventListener('click', e=>{
  if (e.target===sceneBackdrop){ closeSceneDelete(true); return; }
  const act = e.target.closest('button')?.dataset.act; if(!act) return;
  if (act==='cancel'){ closeSceneDelete(true); return; }
  if (act==='confirm'){ const name = sceneDeleteTarget; closeSceneDelete(); doDeleteScene(name); }
});
sceneBackdrop.addEventListener('keydown', e=>{
  if (!sceneBackdrop.classList.contains('open') || e.key!=='Tab') return;
  const btns = [...sceneBackdrop.querySelectorAll('button')];
  const first = btns[0], last = btns[btns.length-1];
  if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

async function doDeleteScene(name){
  try {
    const r = await api('/api/scenes/'+encodeURIComponent(name), { method:'DELETE' });
    if (r.status===404) toast('Scene not found');
    else if (!r.ok) toast('Delete failed');
    else { toast('Deleting…'); loadScenes(); }
  } catch(e){ if(e.message!=='401') toast('Delete failed'); }
}

// ---- capture-scene modal (name + device multi-select, default all checked) ----
const captureBackdrop = document.createElement('div');
captureBackdrop.className = 'modal-backdrop';
captureBackdrop.innerHTML =
  `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="captureTitle">
     <h3 id="captureTitle">Capture scene</h3>
     <form id="captureForm">
       <input id="captureName" class="name-edit" placeholder="scene name" autocomplete="off" />
       <div class="capture-members" id="captureMembers"></div>
       <div class="actions"><button type="button" data-act="cancel">Cancel</button><button class="go" type="submit">Capture</button></div>
     </form>
   </div>`;
document.body.appendChild(captureBackdrop);

function openCapture(){
  const name=document.getElementById('captureName'); name.value='';
  const members=document.getElementById('captureMembers');
  const list=[...defs.keys()].sort((a,b)=>a.localeCompare(b));
  members.innerHTML = list.length
    ? list.map(n=>`<label><input type="checkbox" value="${esc(n)}" checked> ${esc(n)}</label>`).join('')
    : '<span class="legend">no devices to capture</span>';
  captureBackdrop.classList.add('open');
  name.focus();
}
function closeCapture(returnFocus){
  if (!captureBackdrop.classList.contains('open')) return;
  captureBackdrop.classList.remove('open');
  if (returnFocus) document.getElementById('captureSceneBtn')?.focus();
}
captureBackdrop.addEventListener('click', e=>{
  if (e.target===captureBackdrop){ closeCapture(true); return; }
  if (e.target.closest('button')?.dataset.act==='cancel'){ closeCapture(true); }
});
captureBackdrop.addEventListener('keydown', e=>{
  if (!captureBackdrop.classList.contains('open') || e.key!=='Tab') return;
  const els = [...captureBackdrop.querySelectorAll('input, button')];
  const first = els[0], last = els[els.length-1];
  if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});
document.getElementById('captureForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const name=document.getElementById('captureName').value.trim(); if(!name) return;
  const devices=[...document.querySelectorAll('#captureMembers input[type=checkbox]:checked')].map(c=>c.value);
  try {
    const r = await api('/api/scenes/'+encodeURIComponent(name), { method:'PUT', body:JSON.stringify({devices}) });
    if (!r.ok) toast('Could not capture scene');
    else { toast('Scene captured'); closeCapture(); loadScenes(); }
  } catch(e){ if(e.message!=='401') toast('Could not capture scene'); }
});
document.getElementById('captureSceneBtn').addEventListener('click', openCapture);

document.getElementById('newGroupForm').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const input=document.getElementById('newGroupName');
  const name=input.value.trim(); if(!name) return;
  try {
    const r = await api('/api/groups/'+encodeURIComponent(name), { method:'PUT', body:JSON.stringify({members:[]}) });
    if (r.status===409) toast('That name is already taken');
    else if (!r.ok) toast('Could not create group');
    else { toast('Group created'); input.value=''; loadGroups(); }
  } catch(e){ if(e.message!=='401') toast('Could not create group'); }
});

let es;
function connect(){
  if (es) es.close();
  es=new EventSource('/api/events'+(apiKey?'?api_key='+encodeURIComponent(apiKey):''));
  es.onopen=()=>link.classList.add('live');
  es.onerror=()=>link.classList.remove('live');
  es.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch{ return; }
    if (m.type==='state'){ states.set(m.device,m.state); applyState(m.device); applyGroupState(m.device); }
    else if (m.type==='devices'){ loadAll(); }
    else if (m.type==='groups'){ loadGroups(); }
    else if (m.type==='scenes'){ loadScenes(); }
    else if (m.type==='log'){ dockPush(m); commOnLog(m); }
  };
}

// ---- commissioning progress modal (spinner + alpine quips while we wait) ----
const commModal=document.createElement('div');
commModal.className='modal-backdrop';
commModal.innerHTML=
  `<div class="modal comm" role="dialog" aria-modal="true" aria-labelledby="commTitle" aria-live="polite">
     <div class="spinner" aria-hidden="true"></div>
     <h3 id="commTitle">Commissioning…</h3>
     <p id="commMsg" class="comm-msg"></p>
     <p class="comm-hint">Matter interviews can take 30–60 seconds.</p>
     <button class="comm-hide" type="button">hide — watch the log instead</button>
   </div>`;
document.body.appendChild(commModal);
const COMM_QUIPS=["Climbing the mountain…","Searching for the alphorn…","Looking at a cow…",
  "Waiting for good weather…","Warming up the raclette…","Asking the marmots for directions…",
  "Polishing the cowbells…","Yodeling to the device…","Following the hiking trail…","Brewing edelweiss tea…"];
let commQuipTimer=null, commGiveUp=null;
function commQuip(){
  const el=commModal.querySelector('#commMsg');
  let next; do { next=COMM_QUIPS[Math.floor(Math.random()*COMM_QUIPS.length)]; } while(next===el.textContent);
  el.style.opacity=0;
  setTimeout(()=>{ el.textContent=next; el.style.opacity=1; },200);
}
function openComm(){
  commModal.querySelector('.modal.comm').classList.remove('done');
  commModal.querySelector('#commTitle').textContent='Commissioning…';
  commModal.querySelector('#commMsg').textContent=COMM_QUIPS[0];
  commModal.classList.add('open');
  clearInterval(commQuipTimer); commQuipTimer=setInterval(commQuip,2800);
  clearTimeout(commGiveUp); commGiveUp=setTimeout(closeComm,120000); // never trap the user forever
}
function closeComm(){
  commModal.classList.remove('open');
  clearInterval(commQuipTimer); commQuipTimer=null;
  clearTimeout(commGiveUp); commGiveUp=null;
}
function commOutcome(text, ok){
  clearInterval(commQuipTimer); commQuipTimer=null; clearTimeout(commGiveUp); commGiveUp=null;
  commModal.querySelector('.modal.comm').classList.add('done');
  commModal.querySelector('#commTitle').textContent=ok?'Joined!':'Commission failed';
  const el=commModal.querySelector('#commMsg'); el.style.opacity=1; el.textContent=text;
  setTimeout(closeComm, ok?1600:3200);
}
// Close the modal on the real outcome from the Station Log stream.
function commOnLog(m){
  if(!commModal.classList.contains('open')) return;
  if(m.kind==='joined') commOutcome('✓ '+(m.device||'device')+' joined the fabric', true);
  else if(m.kind==='commission_failed') commOutcome('✗ '+(m.msg||'commissioning failed'), false);
}
commModal.querySelector('.comm-hide').addEventListener('click',closeComm);

document.getElementById('commissionForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const code=document.getElementById('code').value.trim(); if(!code) return;
  openComm();
  try { await api('/api/commission',{method:'POST',body:JSON.stringify({code})}); document.getElementById('code').value=''; }
  catch(e){ closeComm(); if(e.message!=='401') toast('Commission failed'); }
});
keyInput.addEventListener('change',()=>{ apiKey=keyInput.value.trim(); localStorage.setItem('mh_key',apiKey); connect(); loadAll(); });

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssId=s=>s.replace(/[^a-z0-9_-]/gi,'_');
const fmt=v=>typeof v==='boolean'?(v?'yes':'no'):String(v);

// draw the ridgeline once on load
const ridge=document.querySelector('.ridge .draw');
if (ridge && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  const len=ridge.getTotalLength();
  ridge.style.strokeDasharray=len; ridge.style.strokeDashoffset=len;
  ridge.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:1400,easing:'ease-out',fill:'forwards'});
}

// ---- Station Log dock ----
// Raw is the whole chronological stream (both categories); Activity filters to milestones.
const dock={el:document.getElementById('dock'),body:document.getElementById('dockBody'),
  last:document.getElementById('dockLast'),mode:'activity',paused:false,
  buf:{activity:[],all:[]},capAct:100,capAll:300};
const dockView=()=>dock.mode==='activity'?dock.buf.activity:dock.buf.all;
function dockRender(){
  dock.body.innerHTML=dockView().map(e=>
    `<div class="ln ${e.level}"><span class="t">${e.ts}</span> `+
    `<span class="k">${esc(e.kind)}</span> ${esc(e.msg)}`+
    `${e.device?` <span class="t">· ${esc(e.device)}</span>`:''}</div>`).join('');
  if(!dock.paused) dock.body.scrollTop=dock.body.scrollHeight;
}
function dockPush(e){
  dock.buf.all.push(e); if(dock.buf.all.length>dock.capAll) dock.buf.all.shift();
  if(e.category==='activity'){ dock.buf.activity.push(e); if(dock.buf.activity.length>dock.capAct) dock.buf.activity.shift(); }
  dock.last.textContent=`last: ${e.kind} · ${e.ts}`;
  // Raw view shows everything; Activity view only its own entries.
  if((dock.mode==='raw' || e.category==='activity') && !dock.paused) dockRender();
}
document.getElementById('dockMode').addEventListener('click',ev=>{
  const m=ev.target.dataset.mode; if(!m) return;
  dock.mode=m;
  [...ev.currentTarget.children].forEach(s=>s.classList.toggle('on',s.dataset.mode===m));
  dockRender();
});
document.getElementById('dockPause').addEventListener('click',ev=>{
  dock.paused=!dock.paused; ev.target.classList.toggle('active',dock.paused);
  ev.target.textContent=dock.paused?'resume':'pause'; if(!dock.paused) dockRender();
});
document.getElementById('dockClear').addEventListener('click',()=>{
  if(dock.mode==='activity') dock.buf.activity=[]; else dock.buf.all=[];
  dockRender();
});
function dockToggleCollapse(){
  const c=dock.el.classList.toggle('collapsed');
  document.getElementById('dockToggle').textContent=c?'▲':'▼';
}
document.getElementById('dockHead').addEventListener('click',dockToggleCollapse);
document.getElementById('dockToggle').addEventListener('click',dockToggleCollapse);
// drag the top edge to resize the log body (grow upward); height persists across reloads
const dockGrip=document.getElementById('dockGrip');
const savedDockH=parseInt(localStorage.getItem('mh_dock_h'),10);
if(savedDockH) dock.body.style.height=savedDockH+'px';
let dockDrag=null;
dockGrip.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  dockDrag={y:ev.clientY,h:dock.body.offsetHeight};
  dockGrip.setPointerCapture(ev.pointerId);
});
dockGrip.addEventListener('pointermove',ev=>{
  if(!dockDrag) return;
  const h=Math.min(Math.round(innerHeight*0.7),Math.max(80,dockDrag.h+(dockDrag.y-ev.clientY)));
  dock.body.style.height=h+'px';
});
dockGrip.addEventListener('pointerup',ev=>{
  if(!dockDrag) return;
  dockDrag=null; dockGrip.releasePointerCapture(ev.pointerId);
  localStorage.setItem('mh_dock_h',dock.body.offsetHeight);
});

connect();
loadAll();
</script>
