<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>matter2mqtt · device console</title>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2230; --border:#2a2f3a;
    --text:#e6edf3; --muted:#8b949e; --accent:#3fb950; --accent-dim:#238636;
    --danger:#f85149; --track:#30363d; --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f6f8fa; --surface:#ffffff; --surface2:#f0f3f6; --border:#d0d7de;
      --text:#1f2328; --muted:#636c76; --accent:#1a7f37; --accent-dim:#1a7f37;
      --danger:#cf222e; --track:#d0d7de;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  header {
    display:flex; flex-wrap:wrap; gap:14px 24px; align-items:center; justify-content:space-between;
    padding:16px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;
    background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px);
  }
  .brand { display:flex; align-items:center; gap:10px; font-family:var(--mono); font-weight:600; letter-spacing:.02em; }
  .brand .sub { color:var(--muted); font-weight:400; font-size:12px; }
  .led { width:9px; height:9px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 0 transparent; }
  .led.live { background:var(--accent); animation:pulse 2.4s ease-out infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent);} 70%{box-shadow:0 0 0 6px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }
  @media (prefers-reduced-motion: reduce) { .led.live { animation:none; } }
  .tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  input, button {
    font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:7px 11px;
  }
  input { font-family:var(--mono); font-size:12.5px; }
  input::placeholder { color:var(--muted); }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent-dim); border-color:transparent; color:#fff; font-weight:600; }
  form.commission { display:flex; gap:8px; }
  form.commission input { width:min(30vw,220px); }

  main { padding:22px; display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); max-width:1200px; margin:0 auto; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 16px 14px; }
  .tile-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:2px; }
  .name { font-weight:600; font-size:15px; word-break:break-all; }
  .meta { font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; margin-top:6px; }
  .dot.on { background:var(--accent); } .dot.off { background:var(--muted); }
  .rows { margin-top:14px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .row label { color:var(--muted); font-size:12px; text-transform:lowercase; letter-spacing:.02em; }
  .readout { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .readout .u { color:var(--muted); font-size:11px; margin-left:2px; }
  .ctl { display:flex; flex-direction:column; gap:6px; }
  .ctl .row { margin:0; }

  /* switch */
  .switch { --w:46px; --h:26px; position:relative; width:var(--w); height:var(--h); flex:none; }
  .switch input { position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch .slot { position:absolute; inset:0; background:var(--track); border-radius:999px; transition:background .18s; }
  .switch .knob { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .18s; box-shadow:0 1px 2px rgba(0,0,0,.4); }
  .switch input:checked + .slot { background:var(--accent-dim); }
  .switch input:checked + .slot + .knob { left:23px; }
  @media (prefers-reduced-motion: reduce) { .switch .slot, .switch .knob { transition:none; } }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:3px; background:var(--track); padding:0; border:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid var(--surface); }
  input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid var(--surface); }

  .empty { text-align:center; color:var(--muted); padding:64px 20px; font-family:var(--mono); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--danger); color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="led" id="led"></span> matter2mqtt <span class="sub">device console</span></div>
  <div class="tools">
    <input id="apikey" type="password" placeholder="api key (if set)" autocomplete="off" />
    <form class="commission" id="commissionForm">
      <input id="code" placeholder="setup code (MT:…)" autocomplete="off" />
      <button class="primary" type="submit">Commission</button>
    </form>
  </div>
</header>

<main id="grid"></main>
<div class="empty" id="empty" hidden>No devices. Commission one, or check the controller connection.</div>
<div class="toast" id="toast"></div>

<script>
const grid = document.getElementById('grid');
const led  = document.getElementById('led');
const keyInput = document.getElementById('apikey');
const SETTABLE = new Set(['state','brightness','color_temp']);

let apiKey = localStorage.getItem('m2m_key') || '';
keyInput.value = apiKey;

const defs = new Map();    // name -> device definition
const states = new Map();  // name -> current state object

function headers(extra) { return Object.assign(apiKey ? { 'X-Api-Key': apiKey } : {}, extra || {}); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: headers(opts && opts.body ? { 'Content-Type':'application/json' } : {}) }, opts));
  if (r.status === 401) { toast('Unauthorized — check the API key'); throw new Error('401'); }
  return r;
}

async function patch(name, body) {
  try { await api('/api/devices/' + encodeURIComponent(name), { method:'PATCH', body: JSON.stringify(body) }); }
  catch (e) { if (e.message !== '401') toast('Set failed'); }
}

async function loadAll() {
  let list;
  try { list = await (await api('/api/devices')).json(); }
  catch (e) { return; }
  defs.clear();
  list.forEach(d => defs.set(d.friendly_name, d));
  await Promise.all(list.map(async d => {
    try { states.set(d.friendly_name, await (await api('/api/devices/' + encodeURIComponent(d.friendly_name))).json()); }
    catch { states.set(d.friendly_name, {}); }
  }));
  render();
}

function render() {
  grid.innerHTML = '';
  const list = [...defs.values()].sort((a,b) => a.friendly_name.localeCompare(b.friendly_name));
  document.getElementById('empty').hidden = list.length > 0;
  for (const d of list) grid.appendChild(tile(d));
  list.forEach(d => applyState(d.friendly_name));
}

function tile(d) {
  const el = document.createElement('section');
  el.className = 'tile'; el.id = 'dev-' + cssId(d.friendly_name);
  const settable = d.exposes.filter(e => SETTABLE.has(e.property) && (e.access & 2));
  const readonly = d.exposes.filter(e => !SETTABLE.has(e.property) || !(e.access & 2));

  el.innerHTML =
    `<div class="tile-head">
       <div><div class="name">${esc(d.friendly_name)}</div>
         <div class="meta">${esc(d.device_type)} · node ${esc(d.node_id)}/${d.endpoint}</div></div>
       <span class="dot ${d.reachable ? 'on' : 'off'}" title="${d.reachable ? 'reachable' : 'unreachable'}"></span>
     </div><div class="rows"></div>`;

  const rows = el.querySelector('.rows');
  for (const e of settable) rows.appendChild(control(d.friendly_name, e));
  for (const e of readonly) rows.appendChild(readoutRow(e));
  return el;
}

function control(name, e) {
  const wrap = document.createElement('div');
  if (e.property === 'state') {
    wrap.className = 'row';
    wrap.innerHTML = `<label>state</label>
      <span class="switch"><input type="checkbox" data-prop="state"><span class="slot"></span><span class="knob"></span></span>`;
    wrap.querySelector('input').addEventListener('change', ev =>
      patch(name, { state: ev.target.checked ? 'ON' : 'OFF' }));
  } else {
    wrap.className = 'ctl';
    const min = e.value_min ?? 0, max = e.value_max ?? 254;
    wrap.innerHTML = `<div class="row"><label>${esc(e.property)}</label>
        <span class="readout" data-prop="${e.property}-val">—</span></div>
      <input type="range" min="${min}" max="${max}" data-prop="${e.property}">`;
    const slider = wrap.querySelector('input');
    slider.addEventListener('input', () => wrap.querySelector('[data-prop$="-val"]').textContent = slider.value);
    slider.addEventListener('change', () => patch(name, { [e.property]: Number(slider.value) }));
  }
  return wrap;
}

function readoutRow(e) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label>${esc(e.property)}</label>
    <span class="readout" data-prop="${e.property}">—<span class="u">${e.unit ? ' ' + esc(e.unit) : ''}</span></span>`;
  return row;
}

function applyState(name) {
  const el = document.getElementById('dev-' + cssId(name));
  if (!el) return;
  const s = states.get(name) || {};
  for (const [prop, val] of Object.entries(s)) {
    const toggle = el.querySelector(`input[type=checkbox][data-prop="${prop}"]`);
    if (toggle) { toggle.checked = String(val).toUpperCase() === 'ON'; continue; }
    const slider = el.querySelector(`input[type=range][data-prop="${prop}"]`);
    if (slider) {
      if (document.activeElement !== slider) slider.value = val;
      const lbl = el.querySelector(`[data-prop="${prop}-val"]`); if (lbl) lbl.textContent = val;
      continue;
    }
    const ro = el.querySelector(`.readout[data-prop="${prop}"]`);
    if (ro) ro.firstChild.textContent = fmt(val);
  }
}

// ---- live stream (SSE) ----
let es;
function connect() {
  if (es) es.close();
  es = new EventSource('/api/events' + (apiKey ? '?api_key=' + encodeURIComponent(apiKey) : ''));
  es.onopen = () => led.classList.add('live');
  es.onerror = () => led.classList.remove('live');
  es.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'state') { states.set(m.device, m.state); applyState(m.device); }
    else if (m.type === 'devices') { loadAll(); }
  };
}

document.getElementById('commissionForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const code = document.getElementById('code').value.trim();
  if (!code) return;
  try { await api('/api/commission', { method:'POST', body: JSON.stringify({ code }) }); document.getElementById('code').value=''; toast('Commissioning started'); }
  catch (e) { if (e.message !== '401') toast('Commission failed'); }
});

keyInput.addEventListener('change', () => {
  apiKey = keyInput.value.trim();
  localStorage.setItem('m2m_key', apiKey);
  connect(); loadAll();
});

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssId = s => s.replace(/[^a-z0-9_-]/gi, '_');
const fmt = v => typeof v === 'boolean' ? (v ? 'yes' : 'no') : String(v);

connect();
loadAll();
</script>
</body>
</html>
