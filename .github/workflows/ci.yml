name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Matterhorn.slnx
      - run: dotnet build Matterhorn.slnx --no-restore --configuration Release
      - run: dotnet test Matterhorn.slnx --no-build --configuration Release --verbosity normal
