# Local test stack: EMQX broker + Matterhorn. Which Matter controller it uses is set in a
# gitignored .env (copy .env.example → .env): the real matterjs-server on the Pi, or the
# in-memory fake with demo devices. Host ports are all in the 16000+ range to avoid clashing.
#
#   docker compose up --build
#
#   EMQX dashboard : http://localhost:16083   (admin / public)
#   REST facade    : http://localhost:16090   (dashboard + GET /api/devices)
#   MQTT           : localhost:16883          (base topic: matterhorn)

name: matterhorn

services:
  emqx:
    image: emqx:5
    container_name: matterhorn-emqx
    ports:
      - "16883:1883"     # MQTT
      - "16083:18083"    # dashboard UI (admin / public)
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [m2m]

  matterhorn:
    build: .
    container_name: matterhorn
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      # Controller selection comes from .env (see .env.example). Defaults keep the repo's
      # zero-config behaviour = the fake demo stack for anyone who just runs `up`.
      Controller__Kind: "${CONTROLLER_KIND:-fake}"
      Controller__WsUrl: "${CONTROLLER_WS_URL:-ws://localhost:5580/ws}"
      DevSeed: "${DEV_SEED:-true}"
      Mqtt__Host: "emqx"
      Mqtt__Port: "1883"
      Mqtt__BaseTopic: "matterhorn"
      Storage__NamesFile: "/data/names.json"
      ASPNETCORE_URLS: "http://+:80"
    ports:
      - "16090:80"     # REST + OpenAPI
    volumes:
      - matterhorn-data:/data
    networks: [m2m]

networks:
  m2m:
    driver: bridge

volumes:
  matterhorn-data:
